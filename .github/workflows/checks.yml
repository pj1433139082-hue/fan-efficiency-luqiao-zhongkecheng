name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install --quiet -r requirements.txt
      - name: 模型行为断言
        working-directory: models/_drafts/fan-efficiency-luqiao-zhongkecheng
        run: python -m unittest discover -s tests
      - name: 效率与组合合并版回归
        run: python -m unittest discover -s apps/integrated/tests -v
      - name: 独立策略与可选时间回归
        run: python -m unittest discover -s tests -v
      - name: 新增公开程序内容检查
        run: python scripts/check_public_content.py
      - name: 脱敏自检（内网域名 / 厂站码）
        run: |
          set -euo pipefail
          hits=$(grep -rIl -E 'bewg\.net\.cn|PS[0-9]{5}-[0-9]{2}' --exclude-dir=.git --exclude-dir=.github . || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error title=脱敏回归::仓库里出现内网域名或厂站码，请先修正导出脚本的 --public 规则"
            exit 1
          fi
          echo "脱敏自检通过"
